[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1440x900x24 -ac -nolisten tcp
user=lab
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; xsetroot -solid "#2e3440" 2>/dev/null || true; exec openbox --sm-disable'
environment=DISPLAY=":0",HOME="/home/lab"
user=lab
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -nopw -localhost -noxdamage -noipv6 -rfbport 5900
user=lab
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:wireshark]
command=/usr/local/bin/start-wireshark
environment=DISPLAY=":0",HOME="/home/lab",XDG_CONFIG_HOME="/home/lab/.config",QT_X11_NO_MITSHM="1",QT_QPA_PLATFORM="xcb",QT_XCB_GL_INTEGRATION="none"
user=lab
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
