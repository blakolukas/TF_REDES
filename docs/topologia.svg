<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Topologia do Trabalho Final - MITM por ARP Spoofing" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gVit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#d4e4ff"/>
    </linearGradient>
    <linearGradient id="gAtk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdecec"/><stop offset="1" stop-color="#f7d4d4"/>
    </linearGradient>
    <linearGradient id="gGw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e0" stop-opacity="1"/><stop offset="1" stop-color="#ffe6bd"/>
    </linearGradient>
    <linearGradient id="gSrv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f7ec"/><stop offset="1" stop-color="#cdecd6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1f3b57"/>
    </marker>
    <marker id="arrowR" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b23b3b"/>
    </marker>
    <style>
      .title{font-size:15px;font-weight:700;fill:#13263a}
      .ip{font-size:12.5px;fill:#5a6b7b;font-family:'SF Mono',Menlo,Consolas,monospace}
      .role{font-size:12px;font-weight:700;letter-spacing:.4px}
      .prog{font-size:11.5px;fill:#2a3b4a;font-family:'SF Mono',Menlo,Consolas,monospace}
      .lbl{font-size:12px;fill:#1f3b57;font-weight:600}
      .lblR{font-size:12px;fill:#b23b3b;font-weight:700}
      .net{font-size:13px;font-weight:700;fill:#3a4a5a}
      .mono{font-size:11.5px;font-family:'SF Mono',Menlo,Consolas,monospace}
    </style>
  </defs>

  <!-- moldura rede_lab -->
  <rect x="18" y="16" width="620" height="520" rx="16" fill="none" stroke="#c3ced9" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="38" y="42" class="net">rede_lab &#8212; 172.10.20.0/24 (bridge isolada)</text>

  <!-- moldura rede_externa -->
  <rect x="662" y="16" width="280" height="520" rx="16" fill="none" stroke="#c3ced9" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="682" y="42" class="net">rede_externa</text>
  <text x="682" y="60" class="net">172.10.30.0/24</text>

  <!-- VITIMA -->
  <g>
    <rect x="42" y="90" width="236" height="110" rx="12" fill="url(#gVit)" stroke="#8fb4f0" stroke-width="1.5"/>
    <text x="62" y="120" class="title">vitima</text>
    <text x="62" y="140" class="ip">172.10.20.2</text>
    <text x="258" y="120" text-anchor="end" class="role" fill="#2a63c7">VITIMA</text>
    <line x1="62" y1="152" x2="258" y2="152" stroke="#8fb4f0" stroke-width="1" opacity="0.6"/>
    <text x="62" y="176" class="prog">curl HTTP/HTTPS/DNS</text>
    <text x="62" y="193" class="prog" fill="#2a63c7">rota default -> gateway</text>
  </g>

  <!-- GATEWAY -->
  <g>
    <rect x="402" y="90" width="196" height="110" rx="12" fill="url(#gGw)" stroke="#e5b65e" stroke-width="1.5"/>
    <text x="422" y="120" class="title">gateway</text>
    <text x="422" y="140" class="ip">172.10.20.1</text>
    <text x="422" y="157" class="ip">172.10.30.1</text>
    <text x="578" y="120" text-anchor="end" class="role" fill="#b4802a">GATEWAY</text>
    <text x="422" y="186" class="prog">ip_forward + NAT</text>
  </g>

  <!-- ATACANTE -->
  <g>
    <rect x="222" y="300" width="236" height="120" rx="12" fill="url(#gAtk)" stroke="#e39a9a" stroke-width="1.8"/>
    <text x="242" y="330" class="title">atacante</text>
    <text x="242" y="350" class="ip">172.10.20.254</text>
    <text x="438" y="330" text-anchor="end" class="role" fill="#b23b3b">MITM</text>
    <line x1="242" y1="362" x2="438" y2="362" stroke="#e39a9a" stroke-width="1" opacity="0.7"/>
    <text x="242" y="386" class="prog">mitm.py (raw socket)</text>
    <text x="242" y="403" class="prog" fill="#b23b3b">ARP spoofing + sniff</text>
  </g>

  <!-- SERVIDORES -->
  <g>
    <rect x="686" y="90" width="232" height="140" rx="12" fill="url(#gSrv)" stroke="#86ca9b" stroke-width="1.5"/>
    <text x="706" y="120" class="title">servidores</text>
    <text x="706" y="140" class="ip">172.10.30.10</text>
    <text x="898" y="120" text-anchor="end" class="role" fill="#1f8a4c">SERVIDORES</text>
    <line x1="706" y1="152" x2="898" y2="152" stroke="#86ca9b" stroke-width="1" opacity="0.6"/>
    <text x="706" y="176" class="prog">DNS (53)  HTTP (80)</text>
    <text x="706" y="194" class="prog">HTTPS (443)  DoH (8443)</text>
    <text x="706" y="214" class="prog" fill="#1f8a4c">*.lab -> 172.10.30.10</text>
  </g>

  <!-- fluxo legitimo vitima <-> gateway (tracejado, o que a vitima pensa) -->
  <line x1="278" y1="130" x2="402" y2="130" stroke="#9fb0c0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="340" y="120" text-anchor="middle" class="lbl" fill="#9fb0c0">fluxo "legitimo"</text>

  <!-- gateway <-> servidores -->
  <line x1="598" y1="140" x2="686" y2="150" stroke="#1f3b57" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- envenenamento: atacante -> vitima e atacante -> gateway -->
  <path d="M300,300 C300,250 240,210 180,200 L160,196" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowR)"/>
  <path d="M380,300 C400,250 460,210 500,202" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowR)"/>
  <rect x="250" y="236" width="180" height="46" rx="10" fill="#fff7f7" stroke="#e39a9a" stroke-width="1.3"/>
  <text x="340" y="256" text-anchor="middle" class="lblR">ARP Reply forjado</text>
  <text x="340" y="273" text-anchor="middle" class="mono" fill="#b23b3b">"estou no MAC do atacante"</text>

  <!-- trafego desviado real (vitima -> atacante -> gateway) -->
  <text x="150" y="250" class="lblR">desvia</text>
  <text x="520" y="250" class="lblR">repassa (ip_forward)</text>

  <!-- rodape -->
  <rect x="222" y="446" width="496" height="74" rx="12" fill="#fbfdff" stroke="#c3ced9" stroke-width="1.2"/>
  <text x="240" y="470" class="lblR">O atacante le os metadados em transito (sem deteccao):</text>
  <text x="240" y="490" class="mono" fill="#5a6b7b">DNS QNAME em claro (UDP/53) . HTTP metodo/Host/URI (TCP/80)</text>
  <text x="240" y="508" class="mono" fill="#5a6b7b">SNI do TLS ClientHello (TCP/443) . self-healing no Ctrl-C</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
